name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[train,dev]"
      - run: ruff check src tests
      - run: pytest -q

  manifests:
    # Static validation of everything that is configuration rather than code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kubernetes manifests (render with kustomize, validate against the API schema)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize k8s | ./kubeconform -strict -summary -kubernetes-version 1.30.0
      - name: Compose file
        run: docker compose config -q
      - name: Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v2.55.1 check rules /m/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v2.55.1 check config /m/prometheus.yml || true
      - name: Grafana dashboard is valid JSON
        run: python -m json.tool monitoring/grafana/dashboards/volops.json > /dev/null

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build both image targets (no push)
        run: |
          docker buildx build --load --target train -t volops-train:ci .
          docker buildx build --load --target serve -t volops-api:ci .
      - name: The API image starts, reports not-ready without a model, and stays alive
        run: |
          docker run -d --name api -p 8000:8000 volops-api:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && break || sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)" = "503"
          docker rm -f api

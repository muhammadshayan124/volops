name: Release

# On a version tag: build both images, scan them, push to GitHub Container Registry, and render the
# Kubernetes manifests pinned to the pushed digests as a release artifact. It deliberately does NOT
# deploy: there is no cluster behind this repository. A deploy step would be one more job that applies
# the rendered manifest, behind an environment with required reviewers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Build train image
        run: docker buildx build --target train -t ghcr.io/$OWNER/volops-train:${{ github.ref_name }} --load .
      - name: Build api image
        run: docker buildx build --target serve -t ghcr.io/$OWNER/volops-api:${{ github.ref_name }} --load .
      - name: Vulnerability scan (fail on fixable HIGH/CRITICAL)
        run: |
          for img in volops-train volops-api; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed ghcr.io/$OWNER/$img:${{ github.ref_name }}
          done
      - name: Push
        run: |
          docker push ghcr.io/$OWNER/volops-train:${{ github.ref_name }}
          docker push ghcr.io/$OWNER/volops-api:${{ github.ref_name }}
      - name: Render manifests pinned to this release
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          cd k8s
          ../kustomize edit set image volops-api=ghcr.io/$OWNER/volops-api:${{ github.ref_name }} volops-train=ghcr.io/$OWNER/volops-train:${{ github.ref_name }}
          ../kustomize build . > ../volops-${{ github.ref_name }}.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: volops-${{ github.ref_name }}.yaml

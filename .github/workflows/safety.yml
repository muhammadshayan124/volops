name: Safety

# Fails the build if a credential is found anywhere in history, or if any commit was made
# with a personal email instead of a GitHub no-reply address.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit identities must be GitHub no-reply addresses
        run: |
          git log --all --format='%h %ae %ce' | awk '
            { for (i = 2; i <= 3; i++)
                if ($i !~ /(@users\.noreply\.github\.com|^noreply@github\.com|^noreply@anthropic\.com)$/) {
                  print "commit " $1 " has a non-no-reply identity"; bad = 1 } }
            END { exit bad }'

      # Run gitleaks over the whole history directly. (The gitleaks GitHub Action derives a "<first commit>^..HEAD" range for a push, which
      # does not exist when the first commit of a new repository is the root commit, and then exits non-zero without having scanned anything.)
      - name: Scan full history for credentials
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.21.2 \
            -c "git config --global --add safe.directory /repo && gitleaks detect --source /repo --redact --no-banner --verbose"

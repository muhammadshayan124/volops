apiVersion: v1
kind: Namespace
metadata:
  name: volops
---
# Shared by the API (read) and the ingest/monitor jobs (write). ReadWriteOnce is enough on a single node
# (k3d/kind/minikube); on a multi-node cluster use ReadWriteMany storage, or move the store to object storage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volops-data
  namespace: volops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: volops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: volops
  labels: {app: mlflow}
spec:
  replicas: 1
  strategy: {type: Recreate}  # sqlite backend: never two writers
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mlflow
          image: volops-train
          command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
                    "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
                    "--artifacts-destination", "/mlflow/artifacts", "--serve-artifacts"]
          ports: [{containerPort: 5000, name: http}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: data, mountPath: /mlflow}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mlflow-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: volops
spec:
  selector: {app: mlflow}
  ports: [{name: http, port: 5000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volops-api
  namespace: volops
  labels: {app: volops-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: volops-api}
  template:
    metadata:
      labels: {app: volops-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: volops-api
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000"}
            - {name: VOLOPS_STORE, value: /data/rates.csv}
            - {name: VOLOPS_MONITOR, value: /data/monitor.json}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 30}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: volops-data, readOnly: true}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: volops-api
  namespace: volops
  labels: {app: volops-api}
spec:
  selector: {app: volops-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: volops-api
  namespace: volops
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: volops-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: volops-api
  namespace: volops
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: volops-api}
---
# Default deny; allow the API to be reached from inside the namespace and from the monitoring namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: volops
spec:
  podSelector:
    matchLabels: {app: volops-api}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 8000}]
